<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatApp</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  </head>
  <body>

    <!-- Settings Toggle Button -->
    <button id="settingsToggleBtn" class="settings-toggle-btn" onclick="toggleSettingsPanel()" aria-label="API Settings">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>

    <!-- Settings Panel -->
    <div id="settingsPanel" class="settings-panel" aria-hidden="true">
      <div class="settings-panel-header">
        <span>Settings</span>
        <button class="settings-close-btn" onclick="toggleSettingsPanel()" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="settings-panel-body">
        <label for="apiKey" class="settings-label">API Key</label>
        <input type="password" id="apiKey" placeholder="Enter API Key" autocomplete="off" />
        <button onclick="saveApiKey()" class="btn-save-key">Save Key</button>
        <div id="apiKeyStatus" class="api-key-status"></div>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <div class="container">

      <!-- Login Section -->
      <div id="loginSection">
        <div class="login-logo">
          <div class="login-logo-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <h1 class="login-app-title">ChatApp</h1>
          <p class="login-subtitle">Real-time messaging for teams</p>
        </div>

        <div class="login-toggle">
          <button class="toggle-btn active" onclick="toggleLoginMode('normal')">Sign In</button>
          <button class="toggle-btn" onclick="toggleLoginMode('first')">First Time Setup</button>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Email</label>
            <input type="email" id="username" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn-primary-full">Sign In</button>
        </form>

        <form id="firstLoginForm" style="display: none">
          <div class="form-group">
            <label for="firstLoginEmail">Email</label>
            <input type="email" id="firstLoginEmail" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="oneTimeToken">One-Time Setup Token</label>
            <input type="text" id="oneTimeToken" placeholder="Paste your setup token" required autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="Create a strong password" required autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat your password" required autocomplete="new-password" />
          </div>
          <button type="submit" class="btn-primary-full">Set Password &amp; Sign In</button>
        </form>
      </div>

      <!-- Home Page -->
      <div id="homePage" style="display: none">
        <nav class="nav-bar">
          <div class="nav-brand">
            <div class="nav-logo">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </div>
            <span class="nav-username">Welcome, <strong id="homeUserDisplayName"></strong></span>
          </div>
          <div class="nav-buttons">
            <button id="registerNavButton" onclick="showRegisterForm()" class="btn-nav" style="display: none">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Register User
            </button>
            <button onclick="logout()" class="btn-nav btn-logout">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Sign Out
            </button>
          </div>
        </nav>

        <div class="home-content">
          <div class="main-layout">
            <div class="main-content">
              <div class="dashboard-section">

                <!-- Direct Message Chat Interface -->
                <div id="chatInterface" class="chat-interface" style="display: none">
                  <div class="chat-header">
                    <button class="back-btn" onclick="closeChatInterface()" aria-label="Go back">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>
                    <div id="chatRecipientAvatar" class="chat-header-avatar"></div>
                    <div class="chat-header-info">
                      <h4 id="chatRecipient"></h4>
                      <span class="chat-status-label">Direct Message</span>
                    </div>
                  </div>
                  <div id="messagesContainer" class="messages-container">
                    <!-- Messages appear here -->
                  </div>
                  <form id="messageForm" class="message-form">
                    <input type="text" id="messageInput" placeholder="Type a message..." required autocomplete="off" />
                    <button type="submit" class="send-btn" aria-label="Send message">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                  </form>
                </div>

                <!-- Room Creation Card -->
                <div class="room-creation-card">
                  <h4>Create a Room</h4>
                  <form id="createRoomForm" class="create-room-form">
                    <div class="form-row">
                      <input type="text" id="roomNameInput" placeholder="Room name" required />
                      <select id="roomType" required>
                        <option value="">Type</option>
                        <option value="public">Public</option>
                        <option value="private">Private</option>
                      </select>
                    </div>
                    <button type="submit">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                      Create Room
                    </button>
                  </form>
                </div>

                <!-- Rooms List -->
                <div id="roomsList" class="rooms-list">
                  <!-- Populated by JS -->
                </div>

                <!-- Room Chat Interface -->
                <div id="roomChatInterface" class="chat-interface" style="display: none">
                  <div class="chat-header">
                    <button class="back-btn" onclick="leaveRoom()" aria-label="Leave room">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>
                    <div id="roomChatAvatar" class="chat-header-avatar"></div>
                    <div class="chat-header-info">
                      <h4 id="currentRoomTitle"></h4>
                      <span class="chat-status-label">Group Room</span>
                    </div>
                    <button class="invite-btn" onclick="showInviteModal()">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                      Invite
                    </button>
                  </div>
                  <div id="roomMessagesContainer" class="messages-container">
                    <!-- Room messages appear here -->
                  </div>
                  <form id="roomMessageForm" class="message-form">
                    <input type="text" id="roomMessageInput" placeholder="Type a message..." required autocomplete="off" />
                    <button type="submit" class="send-btn" aria-label="Send message">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                  </form>
                </div>

              </div>
            </div>

            <!-- Users Sidebar -->
            <div class="users-sidebar">
              <div class="online-users-card">
                <div class="sidebar-header">
                  <h4>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Users
                  </h4>
                  <span id="onlineCount" class="online-badge">0 online</span>
                </div>
                <div class="search-wrapper">
                  <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                  <input type="text" id="userSearch" class="search-input" placeholder="Search users..." oninput="filterUsers(this.value)" autocomplete="off" />
                </div>
                <div id="usersList" class="users-list">
                  <!-- Users appear here -->
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- Welcome Section (fallback) -->
      <div id="welcomeSection" style="display: none">
        <h2>Welcome, <span id="userDisplayName"></span>!</h2>
        <div class="user-content">
          <p>You are successfully logged in.</p>
          <button onclick="logout()" class="btn-logout">Sign Out</button>
        </div>
      </div>

      <!-- Admin Register Section -->
      <div id="adminSection" style="display: none">
        <div class="admin-panel-header">
          <button class="btn-back-text" onclick="backToHome()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            Back to Home
          </button>
          <h2>Register New User</h2>
        </div>
        <form id="adminRegisterForm">
          <div class="form-group">
            <label for="newUsername">Username</label>
            <input type="text" id="newUsername" placeholder="Enter a username" required />
          </div>
          <div class="form-group">
            <label for="newEmail">Email Address</label>
            <input type="email" id="newEmail" placeholder="user@example.com" required />
          </div>
          <button type="submit">Register User</button>
        </form>
      </div>

      <!-- Registration Success -->
      <div id="registrationSuccess" style="display: none" class="success-card">
        <div class="success-check">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h3>User Registered!</h3>
        <div class="registered-user-info">
          <div class="info-row">
            <span class="info-label">Username</span>
            <span id="createdUsername" class="info-value"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Email</span>
            <span id="createdEmail" class="info-value"></span>
          </div>
        </div>
        <div class="token-container">
          <label class="token-label">One-Time Setup Token</label>
          <div class="copy-section">
            <input type="text" id="setupToken" readonly />
            <button type="button" id="copyTokenButton" class="copy-btn">Copy</button>
          </div>
          <p class="token-warning">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:-1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            Share with the user. Valid for first sign-in only.
          </p>
        </div>
      </div>

    </div>

    <!-- Invite Modal -->
    <div id="inviteModal" class="modal" style="display: none" role="dialog" aria-modal="true" aria-labelledby="inviteModalTitle">
      <div class="modal-content">
        <div class="modal-header">
          <h4 id="inviteModalTitle">Invite Users to Room</h4>
          <button class="close-btn" onclick="closeInviteModal()" aria-label="Close modal">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="user-selection">
            <!-- Users with checkboxes appear here -->
          </div>
        </div>
        <div class="modal-footer">
          <button onclick="closeInviteModal()" class="secondary-btn">Cancel</button>
          <button onclick="sendInvites()" class="primary-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            Send Invites
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
